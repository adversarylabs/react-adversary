name: web/react
version: 0.0.13
description: Reviews React source for raw HTML injection, opener attacks, and dynamic code execution.

triggers:
  manual: true
  files_changed:
    - "**/*.jsx"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.ts"

detection:
  files:
    - "**/*.jsx"
    - "**/*.tsx"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
